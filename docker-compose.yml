services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: AssetManagerDb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./src/AssetManager.API
    ports:
      - "5226:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=AssetManagerDb;Username=admin;Password=admin123
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - db

  client:
    build: ./client
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
